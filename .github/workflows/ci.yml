name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            package-lock.json
            server/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm ci
        working-directory: server
      - run: npm audit --omit=dev
        working-directory: server
      - name: Server starts
        working-directory: server
        run: |
          DB_PATH=/tmp/ci.sqlite PORT=4000 node index.js & pid=$!
          for i in $(seq 1 20); do curl -sf localhost:4000/api/items/toWatch && break; sleep 0.5; done
          curl -sf localhost:4000/api/items/toWatch
          kill $pid
